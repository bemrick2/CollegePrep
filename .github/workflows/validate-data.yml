name: Validate CollegePrep data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR supersedes its running checks; main keeps every run.
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate versioned JSON data
        run: python scripts/validate_data.py
      - name: Check migration history is frozen and consistent
        run: python scripts/check_migration_history.py
      - name: Registry reconciliation against the IPEDS four-year universe is current
        run: python scripts/registry_reconciliation.py --check
      - name: Verify actual coverage counts
        run: python scripts/update_coverage.py --check
      - name: Test backend product rules
        run: python -m unittest discover -s tests -v
      - name: Verify pinned official source archives
        run: python scripts/verify_sources.py
      - name: Mutation-check program deep-dive safety rules
        run: python scripts/program_mutation_check.py
      - name: Program-depth completion status is current (docs/PROGRAM_DEPTH_COMPLETION.md)
        run: python -m programs status --check
  mutation:
    # The national pipeline's mutation check is the slowest step (about two hours on one runner); every mutant
    # still runs, split across parallel shards.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mutation-check pipeline safety rules (shard ${{ matrix.shard }}/8)
        env:
          MUTATION_SHARD: ${{ matrix.shard }}/8
        run: python scripts/mutation_check.py
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Create Supabase-compatible test roles
        run: psql -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated; create role service_role bypassrls;'
      - name: Stub Supabase auth schema (no-op where auth exists)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/support/auth_stub.sql
      - name: Apply repository migrations to disposable PostgreSQL
        run: for migration in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$migration"; done
      - name: Test database gate and reference permissions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/reference_access.sql
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test normalized program imports and annual history
        shell: bash  # implies -o pipefail so a generator failure cannot pass as empty input
        run: python scripts/test_program_import.py | psql -v ON_ERROR_STOP=1
      - name: Test public school comparison RPC
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/school_comparison.sql
      - name: Test household accounts, permissions and subscriptions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/household_access.sql
      - name: Test household billing entitlement (CR-16)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/billing.sql
      - name: Emailed student invitations
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/invitation_email.sql
      - name: Test practice grading, recommendations, estimates and progress
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/practice_engine.sql
      - name: CR-14 program-depth fields
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/program_depth.sql
      - name: Front-end contract tests (issue #37)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/frontend_contracts.sql
      - name: Import every repository record twice into the disposable database
        run: |
          python scripts/import_supabase.py --output /tmp/import --reconcile-sql /tmp/reconcile.psql
          for pass in 1 2; do for f in /tmp/import/*.sql; do psql -q -v ON_ERROR_STOP=1 -f "$f"; done; done
      - name: Reconcile ledger and normalized table counts
        run: psql -v ON_ERROR_STOP=1 -f /tmp/reconcile.psql
