name: Validate CollegePrep data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate versioned JSON data
        run: python scripts/validate_data.py
      - name: Verify actual coverage counts
        run: python scripts/update_coverage.py --check
      - name: Test backend product rules
        run: python -m unittest discover -s tests -v
      - name: Verify pinned official source archives
        run: python scripts/verify_sources.py
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Create Supabase-compatible test roles
        run: psql -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated; create role service_role bypassrls;'
      - name: Apply repository migrations to disposable PostgreSQL
        run: for migration in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$migration"; done
      - name: Test database gate and reference permissions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/reference_access.sql
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test normalized program imports and annual history
        shell: bash  # implies -o pipefail so a generator failure cannot pass as empty input
        run: python scripts/test_program_import.py | psql -v ON_ERROR_STOP=1
      - name: Test public school comparison RPC
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/school_comparison.sql
      - name: Import every repository record twice into the disposable database
        run: |
          python scripts/import_supabase.py --output /tmp/import --reconcile-sql /tmp/reconcile.psql
          for pass in 1 2; do for f in /tmp/import/*.sql; do psql -q -v ON_ERROR_STOP=1 -f "$f"; done; done
      - name: Reconcile ledger and normalized table counts
        run: psql -v ON_ERROR_STOP=1 -f /tmp/reconcile.psql
