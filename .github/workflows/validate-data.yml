name: Validate CollegePrep data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate versioned JSON data
        run: python scripts/validate_data.py
      - name: Verify actual coverage counts
        run: python scripts/update_coverage.py --check
      - name: Test backend product rules
        run: python -m unittest discover -s tests -v
