name: Deploy Supabase edge functions

# Deploys supabase/functions after they reach main. Skips (with a notice) until the owner adds the
# SUPABASE_ACCESS_TOKEN secret and SUPABASE_PROJECT_REF variable. Stripe secrets live in Supabase, never here.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

concurrency:
  group: supabase-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: supabase-live
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF not configured; function deploy skipped."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.configured == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.configured == 'true'
        with:
          version: latest
      - name: Deploy billing functions
        if: steps.cfg.outputs.configured == 'true'
        run: |
          supabase functions deploy billing-plans --project-ref "$PROJECT_REF"
          supabase functions deploy billing-checkout --project-ref "$PROJECT_REF"
          supabase functions deploy billing-portal --project-ref "$PROJECT_REF"
          supabase functions deploy send-household-invitation --project-ref "$PROJECT_REF"
          # Stripe authenticates the webhook with its signature, not a Supabase JWT.
          supabase functions deploy stripe-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
