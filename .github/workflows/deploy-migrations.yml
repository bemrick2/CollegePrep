name: Deploy Supabase migrations

# Applies repository migrations that are not yet live, after they reach main.
# Uses the same SUPABASE_DB_URL secret and environment as the live import.
# Each migration runs in one transaction with its schema_migrations row (scripts/apply_migrations.py).
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

concurrency:
  group: live-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: supabase-live
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check for database secret
        id: secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::SUPABASE_DB_URL is not configured; migration deploy skipped."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secret.outputs.configured == 'true'
      - uses: actions/setup-python@v5
        if: steps.secret.outputs.configured == 'true'
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        if: steps.secret.outputs.configured == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply pending migrations and verify live history
        if: steps.secret.outputs.configured == 'true'
        run: python scripts/apply_migrations.py
