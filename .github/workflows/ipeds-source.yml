name: IPEDS source pin
# Push ipeds-request.json ({"year": "2023-24", "files": ["EF2023A.zip", "EF2023A_Dict.zip"]}) to an ipeds-source/** branch.
# Downloads each file from nces.ed.gov, pins it into sources/ipeds/<year>/ with its sha256, and commits to the same branch.
on:
  push:
    branches: ['ipeds-source/**']
    paths: ['ipeds-request.json']
permissions:
  contents: write
jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Download and pin
        run: |
          year=$(python -c "import json;print(json.load(open('ipeds-request.json'))['year'])")
          files=$(python -c "import json;print(' '.join(json.load(open('ipeds-request.json'))['files']))")
          for f in $files; do curl -fsSL --retry 3 -o "$f" "https://nces.ed.gov/ipeds/datacenter/data/$f"; done
          python scripts/pin_ipeds.py "$year" $files
          rm -f $files
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add sources/ipeds && git commit -m "Pin IPEDS files from nces.ed.gov ($(python -c "import json;print(' '.join(json.load(open('ipeds-request.json'))['files']))"))" && git push || echo "nothing to pin"
