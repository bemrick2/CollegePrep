name: Web app

# Front-end checks for web/ (Prep & Price UI). Also runs when stored institution records change: web/scripts/*.test.ts
# read data/institutions (every stored degree plan, #171; the Tennessee pilot roadmap, #194), so a data PR can't
# silently break them.
on:
  push:
    branches: [main]
    paths: ['web/**', 'data/institutions/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'data/institutions/**', '.github/workflows/web.yml']

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Production build (demo mode, no Supabase settings)
        run: npm run build
