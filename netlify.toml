# Prep & Price web app (web/). Staging reads VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY from Netlify env (publishable key only).
# Never add service-role keys here or in the Netlify UI; the app only ever uses the publishable key.
[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The reminder service worker must update promptly when it changes.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
